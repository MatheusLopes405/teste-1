<!DOCTYPE html>
<html>
    <head>
        <style>
            .container-v {
                display: flex;
                flex-direction:column;
                height:100%;
            }

            header, footer {
                flex: 1;
            }
        </style>
    </head>
    <body>
        <div class="container-v">
            <header>
                <p>HEADER</p>
            </header>
            <div class="container">
                <section>
                    <p>SECTION</p>
                    <article>
                        <P>ARTICLE</P>
                    </article>
                </section>
                <aside>
                    <p>ASIDE</p>
                </aside>
            </div>
            <footer>
                <p>FOOTER</p>
            </footer>
        </div>
    </body>
</html>
